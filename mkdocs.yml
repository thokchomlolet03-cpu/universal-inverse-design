site_name: Universal Inverse Design Engine
site_url: https://thokchomlolet03-cpu.github.io/universal-inverse-design/
site_description: >
  An autonomous epistemic engine that identifies the precise missing scientific
  unknowns preventing humanity from solving biological aging — and generates
  de novo molecular designs to fill those gaps.
site_author: Thokchom Lolet Singh

repo_url: https://github.com/thokchomlolet03-cpu/universal-inverse-design
repo_name: thokchomlolet03-cpu/universal-inverse-design
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Thokchom Lolet Singh

theme:
  name: material
  palette:
    # Dark mode — matching The Token Cosmos aesthetic
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/thokchomlolet03-cpu
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

nav:
  - Home: index.md
  - Deep Technical Analysis: blog/03_deep_technical_analysis.md
  - Engineering Manifesto: blog/02_engineering_manifesto.md
  - System Architecture: blog/01_system_architecture.md
