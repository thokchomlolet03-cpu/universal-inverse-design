[project]
name = "uid-engine"
version = "0.1.0"
description = "Universal Inverse Design Engine — Epistemic gap detection for biological immortality research"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "biopython>=1.83",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
uid = "uid_engine.cli:main"
mangal = "mangal_engine.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
